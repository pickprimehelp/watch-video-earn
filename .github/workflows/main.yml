name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          if find . -name "gradlew" -type f | grep -q .; then
            echo "Gradle wrapper found."
          else
            echo "No gradlew found. Searching ZIP files..."

            ZIP=$(find . -maxdepth 3 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)

            if [ -n "$ZIP" ]; then
              echo "Extracting: $ZIP"
              mkdir -p extracted-project
              unzip -q "$ZIP" -d extracted-project
            fi
          fi

          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-video-earn-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
